name: Monitor Official Sources

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: source-freshness
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check authoritative sources
        id: source_check
        continue-on-error: true
        run: npm run sources:check
      - name: Persist source-health state transitions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/source-health.v1.json; then
            echo "No source-health state transition to persist."
            exit 0
          fi
          git config user.name "official-checklist-source-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-health.v1.json
          git commit -m "chore(source-health): refresh official source state"
          if git push origin HEAD:main; then
            echo "Source-health metadata committed to main."
          else
            branch="bot/source-health-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git push origin "$branch"
            gh pr create --base main --head "$branch" --title "Update official source-health state" --body "Automated source monitoring detected a source-health state transition. This PR changes monitoring metadata only; it does not rewrite process rules. Review any companion source-review issue before accepting a changed fingerprint."
          fi
      - name: Open or update source-review issue
        if: steps.source_check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(jq -r '.issues[] | "- **\(.kind)**: \(.detail)" + (if .url then " — " + .url else "" end)' reports/source-freshness.json)
          body=$(printf 'Automated official-source monitoring requires review.\n\n%s\n\nThe bot does **not** rewrite OKF rules or Visa Bulletin cutoff tables. Review the changed/new/unavailable source, update the relevant source node and rule data, then explicitly accept the new fingerprint if appropriate.\n\nRun: `%s`\n' "$summary" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search '"Official source review required" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Official source review required" --body "$body"
          fi
      - name: Fail when authoritative review is required
        if: steps.source_check.outcome == 'failure'
        run: exit 1
